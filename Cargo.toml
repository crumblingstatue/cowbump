[package]
name = "cowbump"
version = "0.3.0-dev"
authors = ["Mika Attila <radiantstatue@gmail.com>"]
edition = "2024"

[dependencies]
walkdir = "2.5.0"
serde = "1.0.200"
serde_derive = "1.0.200"
rmp-serde = "1.3.0"
image = "0.25.6"
arboard = "3.7.0"
thiserror = "2.0"
anyhow = "1.0.82"
fnv = "1.0.7"
directories = "6.0"
open = "5.1.2"
zstd = "0.13.1"
zip = { version = "8", default-features = false }
#egui-sf2g = "0.9.0"
egui-sf2g.git = "https://github.com/crumblingstatue/egui-sf2g.git"
sf2g.version = "0.4.0"
rand = "0.10"
#egui-file-dialog = "0.15"
egui-file-dialog.git = "https://github.com/mukilan/egui-file-dialog.git"
egui-file-dialog.rev = "ba313e380d415cc2e26741b2a92fe4fa466679d6"
parking_lot = "0.12"
#egui_flex = "0.8.0"
egui_flex.git = "https://github.com/crumblingstatue/hello_egui.git"
egui_colors = "0.14"
constcat = "0.6"
egui_system_font_provider = "0.37.0"

[dependencies.recently_used_list]
git = "https://github.com/crumblingstatue/recently_used_list.git"

[dependencies.tagfilter-lang]
git = "https://github.com/crumblingstatue/tagfilter-lang.git"

[profile.dev]
# Leaner target/ directory, but still provides backtrace info
debug = "line-tables-only"

[profile.release]
codegen-units = 1
panic = "abort"
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
